# herdr's seat table: the seats, the classes and the rule's numbers that `herdr seat pick` reads.
# Plan 12 §4 and §5 (nirvana/plans/2026-10-17-12-nirvana-claude-orchestrator.md). herdr wrote this file
# because it was missing; from now on it is yours, like JEV.md. A bad edit is refused with its reason,
# never overwritten: delete the file to get herdr's default back.
#
# Every number is tagged. "measured" came from a probe named beside it, "derived" is a measured token
# count priced by the schedule, "prior" is a guess written down so it can be argued with (decision 0012:
# the table is a prior, and the owner's own runs become the truth).

version = 1
# Efficient, Balanced or SOTA (decision 0018's three stops) when `--mode` is not given.
mode = "balanced"
# Blend each seat's score with its record in record.jsonl (decision 0029's formula). Off in the first
# version: priors stay static and every finished order is logged for offline tuning (plan 12 §4).
use_record = false

[constants]
# A pool window at or under this share left skips its seats. Old Nirvana's ASK_BUDGET_FLOOR (measured
# there, nirvanad/api.py).
floor = 0.05
# The orchestrator runs on max: a max seat that would leave less than this of the 5 h window is skipped.
# A hypothesis (plan 12 §3).
reserve = 0.15
reserve_pool = "max"
reserve_window = "5h"
# pace = clamp((used + ease) / (elapsed + ease), min, max), the foot's formula and numbers
# (nirvana_usage.rs). Hypotheses (Argon's review, §4.2).
pace_ease = 0.10
pace_min = 0.5
pace_max = 2.0
# Plan 14 §2.2: the share of an order inside `spare = max(0, 1 - projected - booked)` is weighted by this so
# projected-unused quota is spent before non-spare quota, while cheaper seats still win inside the spare.
# A hypothesis (plan 14 §2.2).
spare_weight = 0.05
# Quota about to be lost is cheap: a window with more than reset_left left and under reset_within_min
# minutes to its reset is discounted by up to reset_discount, scaled by the share of the order that fits
# before the reset. Hypotheses (Argon's review, §4.3).
reset_left = 0.30
reset_within_min = 60
reset_discount = 0.5
# NoSeat says "defer" when the earliest reset is this near. Old Nirvana's MAX_DEFER_S (1800 s), a hypothesis.
defer_min = 30
# Overrides the orchestrator may make per run without the owner (plan 12 §5.3 step 4).
overrides_per_run = 3
# Decision 0029: multiplier = min(1, ((passes + shrink * prior) / (orders + shrink)) / prior).
record_prior = 0.80
record_shrink = 5.0
# Plan 19 §6.2: Balanced mode climb thresholds. Hypotheses (plan 19 §6.2).
climb_start = 0.70
climb_full = 1.00
# Plan 25 §2: Nirvana Claude starts a fresh session after a run ends only when its context is above this: twice
# the first turn measured in plan 25 §1 (60.7k), a hypothesis.
fresh_above = 120000
# Plan 33 §3.3: lesson reviews a project may queue per UTC day; 0 turns them off. A hypothesis.
lesson_reviews_per_day = 20

# An order's size scales its expected use and its lease. `use` is a multiple of probe P4's order (one
# `slugify` function and its tests, about 45k tokens read and 1.3k written): small is that order.
# `minutes` is how long an order runs, for the reset discount; `lease_minutes` how long a booking holds
# when its runner never releases it. All priors.
[size.small]
use = 1.0
minutes = 15
lease_minutes = 60

[size.medium]
use = 5.0
minutes = 45
lease_minutes = 180

[size.large]
use = 20.0
minutes = 120
lease_minutes = 480

# A pool is one quota several seats spend (plan 12 §3). `windows` are the windows every seat of the pool
# spends; `per_usd` turns an order's list-price cost into a share of each window (plan 12 §4: "One factor
# per pool turns that into a fraction of the pool's windows").

[[pool]]
id = "max"
windows = ["5h", "week"]
per_usd = { "5h" = 0.04, week = 0.00078 }
basis = "derived: week of 2026-10-16, $796 at list price for 62%; 5h stays a prior ($25 of list price per 5 h window, not measured)"

[[pool]]
id = "gemini"
windows = ["5h", "week"]
per_usd = { "5h" = 0.0021, week = 0.00107 }
basis = "derived: plan 19 §2, six Flash high builds moved week 0% to 4.08% for $38.30 (0.00107); 5h at twice, a hypothesis (0.0021)"

[[pool]]
id = "google3p"
windows = ["5h", "week"]
per_usd = { "5h" = 0.31, week = 0.166 }
basis = "measured: plan 19 §2, G·Claude Sonnet high fix round took week 4% to 58% for $3.25 (0.166); 5h 0% to 100% (0.31, a floor)"

[[pool]]
id = "argon"
windows = ["week"]
per_usd = { week = 0.48 }
basis = "derived: P4 argon low spent 1.01% of the week for $0.017 and argon medium 1.01% for $0.026; the mean"

# No windows to read: the rule ranks it with the unread pools, below known headroom, never as free. The local
# seat is off in this version anyway.
[[pool]]
id = "local"
windows = []
per_usd = {}
basis = "free: the local GPU"

# A seat is a CLI, a model and an effort, in one pool, with capabilities (plan 12 §4). `model` names the
# effort as {effort} where the CLI takes it in the model id (agy).
# `prices` are USD per million tokens, each from its date. `use` is the expected share of each window for
# P4's order at each effort, on the date `at`; a later price scales it.

