# Plan 12 §5.4's row: sonnet, argon, flash, g-sonnet. Plan 14 §2.3: g-sonnet is the same model as sonnet
# (88, a hypothesis), and Google's 3.3% 5 h window cost is priced by the rule once its spare is spent.
