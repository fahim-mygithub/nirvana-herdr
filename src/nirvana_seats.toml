# The classes the orchestrator names (plan 12 §5.2), each in one of the nine chains of §5.4 that the
# record is kept by; the class stays a label in the journal. A seat a class does not list is excluded.
# `score` is the seat's prior for the class, 0 to 100. `bars` are the score a seat must reach at each
# mode (decision 0018; default 70/80/100 bounded, 85/90/100 load-bearing): the bar drops to the best seat
# left, never under the Efficient bar. `effort` follows the class and its blast radius (§5.5); a seat's
# own `effort` is its departure. `weight` scales the expected use against P4's order (a prior).
# Plan 70: carbon stands just before argon in every class that lists argon, at argon's score and effort, a prior
# (decision 0012). With argon off, carbon is the Gemini pro seat the rule picks.
# Plan 71: hydrogen stands just before flash in every class that lists flash, at flash's score and effort, a prior
# (decision 0012). With flash off, hydrogen is the Gemini fast seat the rule picks.
# `only_with` takes the seat only when the order needs all of those. A class lists its seats in §5.4's
# order, and that order breaks the last tie.

[[class]]
id = "plan"
chain = "plan"
blast = "load_bearing"
effort = "high"
efficient_effort = "medium"
sota_effort = "high"
weight = 2.0
bars = { efficient = 70, balanced = 90, sota = 100 }
why = "plan 19 §4: strongest at agentic coding; plan 40a: fable 97, a prior (decision 0012), the prompting guide's hard-coding seat"
seats = [
  { seat = "opus", score = 95 },
  { seat = "fable", score = 97 },
  { seat = "carbon", score = 87 },
  { seat = "argon", score = 87 },
  { seat = "sonnet", score = 86 },
  { seat = "hydrogen", score = 74 },
  { seat = "flash", score = 74 },
  { seat = "g-opus", score = 95 },
]

